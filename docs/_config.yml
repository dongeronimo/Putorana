title: Putorana
description: >-
  Building an AR space reconstruction on Android: ARCore depth in, a TSDF in the
  middle, Vulkan out. One article per problem, including the ones that were
  solved wrongly first.
author: dongeronimo

# Project pages are served from a subpath, so baseurl is not optional. Get it
# wrong and every stylesheet, link and image 404s while the markdown still looks
# fine locally.
url: "https://dongeronimo.github.io"
baseurl: "/Putorana"

github_username: dongeronimo
repository: dongeronimo/Putorana

theme: minima

# Articles are a collection rather than posts because Jekyll's _posts require a
# date in the filename and then route and order by it. The unit of writing here
# is a problem, not a day: some days produce three of these and some produce a
# third of one, so a date on the front is a claim about the work that is not
# true. The collection buys undated filenames and a URL that is just the title.
#
# `:name` is the filename slug, not the front matter title, so retitling an
# article does not silently move its URL out from under anyone linking to it.
collections:
  articles:
    output: true
    permalink: /:name/

# jekyll-feed generates from site.posts and there are none, so the feed is valid
# and empty. It stays in the list because minima's head.html calls `feed_meta`
# unconditionally and the build fails on the unknown tag without the plugin
# loaded. Adding articles to it (`feed: collections: articles:`) would date every
# item at build time, which republishes the whole archive on every push.
plugins:
  - jekyll-feed
  - jekyll-seo-tag

# Setting this REPLACES Jekyll's default exclude list rather than adding to it,
# so the defaults are repeated here. Dropping them is how a Gemfile added later
# for a local preview ends up served as a page.
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor/
  - .sass-cache/
  - .jekyll-cache/

kramdown:
  input: GFM
  syntax_highlighter: rouge
